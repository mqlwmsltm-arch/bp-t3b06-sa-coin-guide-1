<style>
/* RESET */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html {
    font-size: 16px;
    scroll-behavior: smooth;
}
body {
    background: #1a1a1a;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    line-height: 1.6;
}

/* TYPOGRAPHY */
h1, h2, h3, h4 {
    font-weight: 800;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    color: #f7e05e; /* acid yellow */
}
h1 {
    font-size: 3.5rem;
    margin-bottom: 1rem;
    border-left: 8px solid #f7e05e;
    padding-left: 1rem;
}
h2 {
    font-size: 2.2rem;
    margin-bottom: 1.2rem;
    border-bottom: 4px double #f7e05e;
    padding-bottom: 0.3rem;
}
h3 {
    font-size: 1.6rem;
    margin-bottom: 0.8rem;
}
p {
    margin-bottom: 1.2rem;
    font-size: 1.1rem;
}
a {
    color: #f7e05e;
    text-decoration: underline wavy;
    transition: color 0.2s;
}
a:hover {
    color: #ff6666;
    text-decoration: underline dotted;
}

/* LAYOUT - FULL BLEED / ASYMMETRIC */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
}
.container > * {
    margin-bottom: 2rem;
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 2rem;
    background: #111;
    border-bottom: 4px solid #f7e05e;
    position: relative;
}
header .logo {
    font-size: 1.8rem;
    font-weight: 900;
    letter-spacing: -0.05em;
    color: #f7e05e;
    text-decoration: none;
}
header .logo:hover {
    color: #ff6666;
}

/* NAV */
nav ul {
    list-style: none;
    display: flex;
    gap: 2rem;
}
nav ul li a {
    font-size: 1.1rem;
    font-weight: 600;
    text-transform: uppercase;
    text-decoration: none;
    color: #e0e0e0;
    padding: 0.5rem 0;
    border-bottom: 2px solid transparent;
}
nav ul li a:hover {
    border-bottom-color: #f7e05e;
    color: #f7e05e;
}

/* HAMBURGER MENU */
.hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
    background: none;
    border: none;
}
.hamburger span {
    display: block;
    width: 30px;
    height: 3px;
    background: #f7e05e;
    transition: 0.3s;
}

/* TEL LINK */
.tel-link {
    display: inline-block;
    background: #f7e05e;
    color: #1a1a1a;
    font-weight: 800;
    padding: 0.5rem 1.2rem;
    text-decoration: none;
    border: 2px solid #f7e05e;
    transition: background 0.2s, color 0.2s;
}
.tel-link:hover {
    background: transparent;
    color: #f7e05e;
}

/* RESPONSIVE 768 */
@media (max-width: 768px) {
    h1 { font-size: 2.2rem; }
    h2 { font-size: 1.6rem; }
    header { flex-wrap: wrap; }
    nav ul {
        display: none;
        flex-direction: column;
        width: 100%;
        background: #111;
        padding: 1rem 0;
    }
    nav ul.active {
        display: flex;
    }
    .hamburger {
        display: flex;
    }
    .container { padding: 1rem; }
}

/* ADDITIONAL STYLES (pattern-based) */
.card-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
}
.card {
    background: #222;
    border: 2px solid #333;
    padding: 1.5rem;
    transition: border-color 0.3s;
}
.card:hover {
    border-color: #f7e05e;
}
.card h3 {
    margin-top: 0;
}
.faq {
    background: #1e1e1e;
    border-left: 6px solid #f7e05e;
